[package]
name = "wargame"
version = "0.1.0"
edition = "2021"

[dependencies]
mlua = { version = "0.12", features = ["lua54", "vendored", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
tiny_http = "0.12"

[profile.release]
opt-level = 3
lto = true
strip = true