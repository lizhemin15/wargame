# =========================================================================
#  淞沪会战 (1937.8.13 — 11.26)  —— 数据驱动兵棋 ruleset
#
#  历史要点争夺战：国民政府军（owner 0，下/黄字）死守上海，伺机反攻；
#  日本陆军/海军陆战队（owner 1，上/黑字）自吴淞口登陆，向市区推进。
#
#  胜利条件（[victory] need_points=4）：
#    日军需攻夺 国军 3 城 + 自占要点 至 4 点 → 攻略上海
#    国军守住 罗店/大场/四行 3 城后反击，夺回虹口/吴淞/闸北任一 → 4 点 → 挫败入侵
#
#  兵种（师团级抽象）：
#    国军：中央军步兵(attack4/def4) 炮兵(range2) 地方军步兵(att3/def3)
#    日军：师团步兵(att5/def4) 战车联队(slide,att8/def5) 海军舰炮(range3,沿江)
# =========================================================================

name = "淞沪会战-虹口争夺"
ruleset_version = "0.2.0"

# ---------------- 地形 ----------------
[terrains.plain]
name = "郊野"
symbol = "."
move_cost = 1
defense_bonus = 0

[terrains.farm]
name = "农田村落"
symbol = "F"
move_cost = 2
defense_bonus = 10

[terrains.hill]
name = "高地"
symbol = "^"
move_cost = 2
defense_bonus = 30

[terrains.water]
name = "江河"
symbol = "~"
move_cost = 0            # 不可通行
defense_bonus = 0

[terrains.city]
name = "城区·租界"
symbol = "R"
move_cost = 2
defense_bonus = 40        # 巷战加固

[terrains.wharf]
name = "码头·登陆场"
symbol = "W"
move_cost = 1
defense_bonus = 0

[terrains.fort]
name = "堡垒·四行仓库"
symbol = "#"
move_cost = 1
defense_bonus = 55        # 坚垒难攻

# ---------------- 兵种类别 ----------------
[unit_classes]
[unit_classes.infantry]
name = "步兵类"
move_cost = 1

[unit_classes.arty]
name = "炮兵类"
move_cost = 1

[unit_classes.tank]
name = "装甲类"
move_cost = 1

[unit_classes.local]
name = "守备类"
move_cost = 1

[unit_classes.naval]
name = "舰炮类"
move_cost = 1        # 特殊：允许逗留水域

# ---------------- 兵种 ----------------
# --- 国民政府军 (owner 0) ---
[units.cn_inf]
name = "中央军步兵师"
class = "infantry"
move_points = 2
move_style = "step"
move_offsets = [[1,0],[-1,0],[0,1],[0,-1]]
attack = 4
defense = 4
range = 1

[units.cn_arty]
name = "国军炮兵"
class = "arty"
move_points = 1
move_style = "step"
move_offsets = [[1,0],[-1,0],[0,1],[0,-1]]
attack = 6
defense = 2
range = 2

[units.cn_local]
name = "地方军步兵"
class = "infantry"
move_points = 2
move_style = "step"
move_offsets = [[1,0],[-1,0],[0,1],[0,-1]]
attack = 3
defense = 3
range = 1

# --- 日本军队 (owner 1) ---
[units.jp_div]
name = "师团步兵"
class = "infantry"
move_points = 2
move_style = "step"
move_offsets = [[1,0],[-1,0],[0,1],[0,-1]]
attack = 5
defense = 4
range = 1

[units.jp_tank]
name = "战车联队"
class = "tank"
move_points = 3
move_style = "slide"
move_offsets = [[1,0],[-1,0],[0,1],[0,-1]]
attack = 8
defense = 5
range = 1

[units.jp_navy]
name = "海军舰炮"
class = "naval"
move_points = 1
move_style = "step"
move_offsets = [[1,0],[-1,0],[0,1],[0,-1]]
attack = 6
defense = 2
range = 3

