name: release

# 打 tag 时云编译三平台一键安装包
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: macos-x86_64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-aarch64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
            ext: .exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      # macOS aarch64 从 x86_64 runner 交叉编译需要 target
      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}
        
      - name: Inspect build output
        shell: bash
        run: |
          ls -la target/${{ matrix.target }}/release/

      # 打包：一键安装包（目录含 二进制 + plugins/ + 说明）
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/wargame${{ matrix.ext }}"
          # 组装发布目录（内外同结构，解压后直接进目录运行）
          ROOT="dist/wargame-${{ matrix.suffix }}"
          mkdir -p "$ROOT"/plugins
          cp "$BIN" "$ROOT/wargame${{ matrix.ext }}"
          cp plugins/*.lua "$ROOT/plugins/"
          cp README.md LICENSE "$ROOT/" 2>/dev/null || true
          # 压缩：windows 用 PowerShell 内置 Compress-Archive 打 zip（GUI 解压友好），类unix 用 tar.gz
          BINB=${{ matrix.ext }}
          if [ -n "$BINB" ]; then
            # windows → zip（用 powershell 内置，避免 tar 不支持 zip）
            powershell -Command "Compress-Archive -Path 'dist/wargame-${{ matrix.suffix }}/*' -DestinationPath 'dist/wargame-${{ matrix.suffix }}.zip' -Force"
          else
            # linux / mac → tar.gz
            tar -C dist -czf "dist/wargame-${{ matrix.suffix }}.tar.gz" "wargame-${{ matrix.suffix }}"
          fi
          ls -la dist/*.tar.gz dist/*.zip 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wargame-${{ matrix.suffix }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 GitHub Release 需要写入权限
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la /tmp/artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/artifacts/*
          generate_release_notes: true